<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#eaeefb" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#080c26" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Pando">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<title>Pando</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="top">
  <span class="brand" id="brand"></span>
  <button class="datebtn" id="datebtn" type="button" aria-haspopup="listbox"></button>
</header>

<div class="picker" id="picker" hidden role="listbox" aria-label="Date"></div>

<main>
  <div class="dialbox">
    <div class="tog" id="tog"></div>
    <svg class="dial" id="dial" viewBox="0 0 300 300" width="300" height="300"
         role="slider" aria-label="Time" aria-valuemin="0" aria-valuemax="1439"></svg>
  </div>

  <ul class="cities" id="cities"></ul>

  <button class="add" id="add" type="button">
    <span>Add city</span><span class="plus" aria-hidden="true"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5.5v13M5.5 12h13"/></svg></span>
  </button>

  <p class="empty" id="empty">
    Which city are you in? The first one you add becomes <b>home</b>, and every other time is
    shown against it.
  </p>
</main>

<div class="sheet" id="sheet" hidden>
  <div class="sheetcard" role="dialog" aria-label="Add a city">
    <div class="searchrow">
      <input id="q" type="search" placeholder="Search cities" autocomplete="off"
             autocorrect="off" autocapitalize="off" spellcheck="false">
      <button class="cancel" id="cancel" type="button">Cancel</button>
    </div>
    <div class="sheet-body">
      <ul class="results" id="results"></ul>
      <p class="hint" id="hint">Start typing a city name.</p>
    </div>
  </div>
</div>

<footer>City data from <b>GeoNames</b>, CC BY 4.0 · times from your device’s own timezone database
  <span class="build" id="build"></span></footer>

<!-- Installed to the home screen there is no address bar and so no reload button. Without this
     the app can sit on a cached build indefinitely and never tell you. -->
<div class="toast" id="toast" hidden>
  <span>A new version is ready.</span>
  <button type="button" id="reload">Reload</button>
</div>

<script src="app.js"></script>
<script>
/* Offline + Add to Home Screen. Registration is fire-and-forget: a browser without
   service workers, or a page opened over file://, just runs as a normal web page.
   Skipped inside a frame: paper-options.html runs several copies of the app to compare
   themes, and a cache serving them yesterday's stylesheet makes the comparison a lie. */
if ('serviceWorker' in navigator && window.top === window) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').then(function (reg) {
      /* A worker that installs while another one is already controlling the page means the
         files on the server have changed. Say so, rather than waiting for a reload that a
         home-screen app has no way to ask for. */
      function watch(w) {
        if (!w) return;
        w.addEventListener('statechange', function () {
          if (w.state === 'installed' && navigator.serviceWorker.controller) {
            document.getElementById('toast').hidden = false;
          }
        });
      }
      if (reg.waiting && navigator.serviceWorker.controller) {
        document.getElementById('toast').hidden = false;
      }
      watch(reg.installing);
      reg.addEventListener('updatefound', function () { watch(reg.installing); });
      /* Standalone apps are resumed, not reloaded - so check for a new build on every resume. */
      document.addEventListener('visibilitychange', function () {
        if (!document.hidden) reg.update().catch(function () {});
      });
    }).catch(function () {});
  });
  document.getElementById('reload').addEventListener('click', function () {
    location.reload();
  });
}
</script>
</body>
</html>
